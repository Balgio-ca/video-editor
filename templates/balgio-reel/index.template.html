<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>{{TITLE}}</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; src: url("fonts/Montserrat.ttf") format("truetype"); font-weight: 100 900; font-style: normal; }
      @font-face { font-family: "Montserrat"; src: url("fonts/Montserrat-Italic.ttf") format("truetype"); font-weight: 100 900; font-style: italic; }
      @font-face { font-family: "Caveat"; src: url("fonts/Caveat.ttf") format("truetype"); font-weight: 400 700; font-style: normal; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Montserrat", sans-serif; }
      video, img.broll { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 42%; }
      #talk { z-index: 0; }
      .broll { z-index: 1; }
      #endcard { z-index: 3; }
      .carte-fin { position: absolute; inset: 0; }
      .carte-fin .cf-in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 38px; text-align: center; padding: 0 80px; }
      .hook { position: absolute; inset: 0; z-index: 6; display: flex; justify-content: center; align-items: flex-start; padding: 64px 60px 0 60px; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.55) 190px, rgba(0,0,0,0) 330px); }
      .hook .h { display: block; max-width: 960px; white-space: nowrap; color: #fff; font-weight: 900; font-size: 58px; line-height: 1.06; text-align: center; letter-spacing: -0.02em; text-transform: uppercase; text-shadow: 0 3px 8px rgba(0,0,0,0.6); will-change: transform, opacity; }
      .cap.impactcap { padding-top: 790px; }
      .hook .h em { font-style: normal; color: {{ACCENT}}; }
      .cap { position: absolute; inset: 0; z-index: 5; display: flex; justify-content: center; align-items: flex-start; padding: {{CAP_TOP}}px 60px 0 60px; pointer-events: none; }
      .cap .w { display: inline-block; color: #fff; text-align: center; line-height: 1.05; text-shadow: 0 2px 6px rgba(0,0,0,0.55), 0 0 18px rgba(0,0,0,0.35); will-change: transform, opacity; }
      .cap .w.normal, .cap .w.big, .cap .w.script { background: rgba(0,0,0,0.55); padding: 12px 30px 15px 30px; border-radius: 18px; box-decoration-break: clone; }
      .cap .w.box { background: rgba(0,0,0,0.55); }
      .w.normal { font-weight: 800; font-size: {{FS_NORMAL}}px; letter-spacing: -0.01em; }
      .w.big { font-weight: 900; font-size: {{FS_BIG}}px; letter-spacing: -0.02em; color: {{ACCENT}}; }
      .w.script { font-family: "Caveat", cursive; font-weight: 700; font-size: {{FS_SCRIPT}}px; transform: rotate(-3deg); }
      .w.box { font-weight: 800; font-size: {{FS_BOX}}px; padding: 14px 36px 18px 36px; border: 7px solid rgba(255,255,255,0.92); border-radius: 30px; background: rgba(0,0,0,0.18); }
      .w .k { display: inline-block; will-change: transform, color; }
      .cta { position: absolute; inset: 0; z-index: 6; display: flex; justify-content: center; align-items: flex-start; padding-top: 1545px; pointer-events: none; }
      .cta .pill { display: inline-block; background: #fff; color: #111; font-weight: 800; font-size: 40px; letter-spacing: -0.01em; padding: 22px 44px; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,0.35); will-change: transform, opacity; }
      .cta .pill em { font-style: normal; color: {{ACCENT}}; }
      .w.barre { position: relative; display: block; width: 100%; font-weight: 900; font-size: {{FS_BARRE}}px; line-height: 0.98; letter-spacing: -0.03em; text-transform: uppercase; color: #fff; text-shadow: 0 6px 24px rgba(0,0,0,0.7); }
      .w.barre { white-space: nowrap; }
      .w.barre .xb { position: absolute; height: 40px; background: #E3242B; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,0.45); will-change: transform; }
      .sticker { position: absolute; left: 0; top: 420px; width: 1080px; z-index: 6; display: flex; justify-content: flex-end; padding-right: 64px; pointer-events: none; }
      .sticker img { width: 220px; height: 220px; filter: drop-shadow(0 10px 24px rgba(0,0,0,0.45)); will-change: transform, opacity; }
      .cap .w.tel { font-weight: 700; font-style: italic; font-size: {{FS_NORMAL}}px; color: #111; background: rgba(255,255,255,0.93); padding: 12px 30px 15px 30px; border-radius: 18px; text-shadow: none; }
      .cap .w.tel .qui { display: block; font-style: normal; font-weight: 900; font-size: 26px; letter-spacing: 0.14em; color: {{ACCENT}}; margin-bottom: 2px; }
      .sticker.traverse { top: 1380px; justify-content: flex-start; padding-right: 0; }
      .sticker.traverse img { width: 300px; height: 190px; }
      .sticker.entree { top: 1060px; justify-content: flex-end; padding-right: 10px; }
      .carte { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; pointer-events: none; overflow: hidden; }
      .carte .ca-bg { position: absolute; inset: 0; background: var(--cf); }
      .carte .ca-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 0 70px; text-align: center; color: var(--ct); will-change: transform, opacity; }
      .carte .ca-t { font-weight: 900; font-size: 150px; line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase; }
      .carte .ca-s { font-weight: 700; font-size: 52px; line-height: 1.15; opacity: 0.92; }
      .verdict { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; pointer-events: none; }
      .verdict .vd-bg { position: absolute; inset: 0; background: var(--vc); }
      .verdict.faux, .verdict.red { --vc: linear-gradient(160deg, rgba(232,52,52,0.95), rgba(150,14,24,0.95)); }
      .verdict.vrai, .verdict.green { --vc: linear-gradient(160deg, rgba(38,190,104,0.95), rgba(10,112,62,0.95)); }
      .verdict.mitige { --vc: linear-gradient(160deg, rgba(38,190,104,0.95) 0%, rgba(38,190,104,0.95) 49.6%, rgba(220,44,44,0.95) 50.4%, rgba(220,44,44,0.95) 100%); }
      .verdict .vd-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 34px; will-change: transform, opacity; }
      .verdict .vd-ic { width: 300px; height: 300px; overflow: visible; filter: drop-shadow(0 12px 28px rgba(0,0,0,0.35)); }
      .verdict .vd-c, .verdict .vd-p { fill: none; stroke: #fff; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 340; }
      .verdict .vd-f { fill: #fff; }
      .verdict .vd-mot { color: #fff; font-weight: 900; font-size: 210px; line-height: 0.92; letter-spacing: -0.03em; text-align: center; text-shadow: 0 10px 30px rgba(0,0,0,0.35); }
      .verdict.mitige .vd-mot { display: flex; flex-direction: column; align-items: center; font-size: 250px; line-height: 0.95; }
      .verdict.mitige .vd-e { font-size: 90px; line-height: 1.3; letter-spacing: 0.08em; opacity: 0.92; }
      .verdict.mitige .vd-v { transform: translateY(-40px); }
      .verdict.mitige .vd-x { transform: translateY(40px); }
      .verdict.red .vd-mot, .verdict.green .vd-mot { font-size: 190px; }
      .verdict.red .vd-ic, .verdict.green .vd-ic { width: 400px; height: 400px; }
      .sticker.entree img { width: 300px; height: 535px; object-fit: contain; filter: drop-shadow(0 14px 26px rgba(0,0,0,0.5)); transform-origin: 50% 100%; }
      .w.impact { display: block; width: 100%; font-weight: 900; font-size: {{FS_IMPACT}}px; line-height: 0.98; letter-spacing: -0.03em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 3px {{ACCENT}}; text-shadow: 0 6px 24px rgba(0,0,0,0.7); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="{{DURATION}}" data-fps="30">
      <video id="talk" src="{{TALK_SRC}}" data-start="0" data-duration="{{TALK_DURATION}}" data-media-start="0" data-has-audio="true" data-track-index="0"></video>
{{BROLL}}
{{ENDCARD}}
{{HOOK}}
{{CTA}}
{{CAPTIONS}}
{{SFX}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
{{TWEENS}}
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
